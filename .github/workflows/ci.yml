name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Focused Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Run focused tests
        run: uv run --no-sources --locked --extra dev pytest tests/cuvis_ai_ultralytics -v

  lint:
    name: Focused Ruff Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Check formatting
        run: uv run --no-sources --locked --extra dev ruff format --check cuvis_ai_ultralytics tests/cuvis_ai_ultralytics

      - name: Run ruff
        run: uv run --no-sources --locked --extra dev ruff check cuvis_ai_ultralytics tests/cuvis_ai_ultralytics

  security:
    name: Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Run detect-secrets
        run: uv run --no-sources --locked --extra dev detect-secrets scan --baseline .secrets.baseline

      - name: Run pip-audit
        run: |
          # CVE-2025-3000 (torch): fixed in 2.13.0; the pinned line stays on 2.11 until the next
          # torch release is qualified for the ecosystem, so the advisory is ignored until then.
          # PYSEC-2026-3447 (setuptools): fixed in 83.0.0; the export and solutions extras cap
          # setuptools at 81, and the flaw only affects building sdists on macOS.
          uv run --no-sources --locked --extra dev pip-audit --desc on --skip-editable --ignore-vuln CVE-2025-3000 --ignore-vuln PYSEC-2026-3447

  build:
    name: Build And Validate
    needs: [test, lint]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Build distributions
        run: uv build --no-sources

      - name: Validate distributions
        run: uv run --no-sources --locked --with twine twine check dist/*
